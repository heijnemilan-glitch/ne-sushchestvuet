<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>НЕ СУЩЕСТВУЕТ</title>
<style>:root {
  --bg: #0b0d0d;
  --panel: rgba(14, 17, 17, 0.94);
  --line: rgba(200, 210, 200, 0.14);
  --text: #d6dbd4;
  --dim: #8b948c;
  --accent: #c9d8c2;
  --warn: #e0a060;
  --term: #9fe8c0;
  --font: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --mono: Consolas, 'Courier New', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--text); font-family: var(--font); overflow: hidden; user-select: none; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.layer { position: fixed; inset: 0; pointer-events: none; }
.hidden { display: none !important; }

/* атмосфера: виньетка и зерно */
#vignette { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%); }
#grain { opacity: 0.06; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); animation: grain 0.5s steps(3) infinite; }
@keyframes grain { 0% { transform: translate(0,0); } 33% { transform: translate(-3%, 2%); } 66% { transform: translate(2%, -3%); } }
#distort { mix-blend-mode: screen; opacity: 0; background: linear-gradient(90deg, rgba(255,0,0,0.12), transparent 30%, transparent 70%, rgba(0,255,255,0.12)); transition: opacity 0.15s; }
#fade { background: #000; opacity: 0; transition: opacity 0.6s; }

/* HUD */
#crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(230,235,228,0.55); transition: transform 0.15s, background 0.15s; }
#crosshair.active { transform: scale(2.2); background: rgba(240,245,236,0.9); }
#prompt { position: fixed; left: 50%; top: calc(50% + 26px); transform: translateX(-50%); font-size: 14px; letter-spacing: 0.04em; color: var(--text); text-shadow: 0 1px 3px #000; white-space: nowrap; opacity: 0; transition: opacity 0.15s; }
#prompt.on { opacity: 0.92; }
#prompt kbd, .kbd { font-family: var(--mono); font-size: 12px; border: 1px solid rgba(220,230,220,0.45); border-radius: 3px; padding: 1px 5px; margin-right: 6px; }
#hint { position: fixed; left: 50%; bottom: 13%; transform: translateX(-50%); max-width: min(720px, 86vw); text-align: center; font-size: 16px; line-height: 1.5; color: #e2e6de; text-shadow: 0 1px 4px #000, 0 0 12px #000; opacity: 0; transition: opacity 0.4s; }
#hint.on { opacity: 1; }
#area { position: fixed; left: 50%; top: 12%; transform: translateX(-50%); font-size: 13px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--dim); opacity: 0; transition: opacity 1.2s; }
#area.on { opacity: 0.85; }
#toasts { position: fixed; left: 22px; top: 20px; display: flex; flex-direction: column; gap: 6px; }
.toast { font-size: 13px; color: var(--text); background: rgba(10,12,12,0.7); border-left: 2px solid var(--accent); padding: 6px 12px; animation: toast 4.5s forwards; }
@keyframes toast { 0% { opacity: 0; transform: translateX(-8px); } 8% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }
#helpline { position: fixed; right: 18px; bottom: 14px; font-size: 12px; color: var(--dim); opacity: 0.75; text-align: right; line-height: 1.7; }
#lockhint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 14px 22px; background: rgba(0,0,0,0.6); border: 1px solid var(--line); font-size: 14px; pointer-events: auto; cursor: pointer; }

/* слои: окна всегда поверх меню и экрана финала */
#menu, #ending { z-index: 40; }
#modal { z-index: 50; }
#lockhint { z-index: 55; }
#fade { z-index: 60; }

/* панели */
.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(4,5,5,0.72); pointer-events: auto; backdrop-filter: blur(2px); }
.screen.solid { background: radial-gradient(ellipse at 50% 40%, #121615 0%, #050606 70%); }
.panel { background: var(--panel); border: 1px solid var(--line); width: min(860px, 94vw); max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
.panel header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); font-size: 13px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim); }
.panel .body { padding: 18px 22px; overflow-y: auto; }
.panel .footer { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
button.btn { font-family: var(--font); background: transparent; color: var(--text); border: 1px solid rgba(210,220,210,0.25); padding: 8px 16px; font-size: 14px; cursor: pointer; letter-spacing: 0.03em; }
button.btn:hover, button.btn:focus-visible { background: rgba(210,220,210,0.1); border-color: rgba(210,220,210,0.55); outline: none; }
button.btn:disabled { opacity: 0.35; cursor: default; }
button.btn.danger { border-color: rgba(224,120,90,0.4); color: #e6b0a0; }
.x { background: none; border: 0; color: var(--dim); font-size: 20px; cursor: pointer; line-height: 1; }

/* главное меню */
#menu .wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: min(520px, 90vw); }
#menu h1 { font-weight: 300; letter-spacing: 0.24em; white-space: nowrap; font-size: clamp(26px, 4.4vw, 50px); margin: 0 0 4px; color: #e4e8e0; }
#menu h1 span { display: inline-block; }
#menu .sub { color: var(--dim); letter-spacing: 0.4em; font-size: 12px; margin-bottom: 34px; text-transform: uppercase; }
.menu-item { background: none; border: 0; color: var(--text); font-family: var(--font); font-size: 18px; letter-spacing: 0.08em; padding: 7px 0; cursor: pointer; text-align: left; opacity: 0.82; transition: opacity 0.15s, padding 0.15s; }
.menu-item:hover, .menu-item:focus-visible { opacity: 1; padding-left: 10px; outline: none; }
.menu-item:disabled { opacity: 0.25; cursor: default; padding-left: 0; }
#menu .foot { margin-top: 36px; color: var(--dim); font-size: 12px; line-height: 1.8; max-width: 520px; }

/* слоты */
.slot { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.slot .meta { font-size: 13px; color: var(--dim); margin-top: 3px; }
.slot .name { font-size: 15px; }
.slot .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.slot .acts .btn { padding: 5px 10px; font-size: 13px; }
.bad { color: var(--warn); }

/* настройки */
.row { display: grid; grid-template-columns: 220px 1fr 70px; gap: 12px; align-items: center; padding: 7px 0; font-size: 14px; }
.row input[type=range] { width: 100%; accent-color: #b8c8b4; }
.row select { background: #111; color: var(--text); border: 1px solid var(--line); padding: 5px; font-size: 14px; }
.row .val { color: var(--dim); font-family: var(--mono); font-size: 13px; text-align: right; }
.keyrow { display: grid; grid-template-columns: 220px 160px; gap: 12px; align-items: center; padding: 4px 0; font-size: 14px; }
.keybtn { font-family: var(--mono); background: #111; color: var(--text); border: 1px solid var(--line); padding: 5px 10px; cursor: pointer; text-align: left; }
.keybtn.wait { border-color: var(--warn); color: var(--warn); }
h3 { font-weight: 400; font-size: 12px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim); margin: 18px 0 6px; }

/* инвентарь */
.inv { display: grid; grid-template-columns: 260px 1fr; gap: 18px; min-height: 300px; }
.inv-list { display: flex; flex-direction: column; gap: 2px; }
.inv-item { text-align: left; background: none; border: 1px solid transparent; color: var(--text); padding: 9px 12px; font-size: 14px; cursor: pointer; font-family: var(--font); }
.inv-item:hover { background: rgba(255,255,255,0.04); }
.inv-item.sel { border-color: var(--line); background: rgba(255,255,255,0.06); }
.inv-desc { font-size: 15px; line-height: 1.6; color: var(--text); }
.inv-desc .t { font-size: 18px; margin-bottom: 8px; }
.empty { color: var(--dim); font-size: 14px; }

/* журнал */
.tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { background: none; border: 0; color: var(--dim); padding: 11px 12px; font-size: 13px; letter-spacing: 0.08em; cursor: pointer; border-bottom: 2px solid transparent; font-family: var(--font); }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.entry { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.55; }
.entry .when { color: var(--dim); font-size: 12px; font-family: var(--mono); margin-right: 10px; }
.entry .title { font-size: 15px; color: #e6eae2; margin-bottom: 3px; }
.entry button.link { background: none; border: 0; color: var(--text); padding: 0; font-size: 15px; cursor: pointer; text-align: left; font-family: var(--font); text-decoration: underline; text-decoration-color: rgba(220,230,220,0.25); }
textarea.notes { width: 100%; min-height: 320px; background: #0c0e0e; color: var(--text); border: 1px solid var(--line); padding: 12px; font-family: var(--mono); font-size: 14px; line-height: 1.6; resize: vertical; user-select: text; }
.mapwrap { display: flex; flex-direction: column; gap: 8px; }
.mapwrap canvas { width: 100%; background: #0a0c0c; border: 1px solid var(--line); }
.mapwrap .lv { display: flex; gap: 6px; }
input.code { background: #0c0e0e; color: var(--text); border: 1px solid var(--line); padding: 8px 10px; font-family: var(--mono); font-size: 15px; letter-spacing: 0.1em; width: 220px; text-transform: uppercase; user-select: text; }
.codes .mine { font-family: var(--mono); color: var(--accent); user-select: text; }

/* записка */
.paper { background: #d9d4c4; color: #222; width: min(620px, 92vw); max-height: 84vh; overflow-y: auto; padding: 34px 40px; font-family: Georgia, 'Times New Roman', serif; font-size: 17px; line-height: 1.65; white-space: pre-wrap; box-shadow: 0 20px 70px rgba(0,0,0,0.7); position: relative; }
.paper h2 { font-weight: normal; font-size: 19px; margin: 0 0 16px; border-bottom: 1px solid rgba(0,0,0,0.2); padding-bottom: 10px; }
.paper .close { position: absolute; right: 14px; top: 10px; color: #555; font-size: 13px; font-family: var(--font); cursor: pointer; }

/* терминал */
.term { background: #040806; border: 1px solid #1d3a2a; width: min(780px, 94vw); max-height: 86vh; display: flex; flex-direction: column; font-family: var(--mono); color: var(--term); box-shadow: 0 0 60px rgba(60,180,120,0.12), inset 0 0 80px rgba(0,0,0,0.6); }
.term .title { padding: 10px 16px; border-bottom: 1px solid #1d3a2a; font-size: 12px; letter-spacing: 0.2em; opacity: 0.7; }
.term .out { padding: 18px 20px; white-space: pre-wrap; font-size: 15px; line-height: 1.55; min-height: 180px; overflow-y: auto; text-shadow: 0 0 6px rgba(120,255,180,0.35); }
.term .opts { padding: 6px 20px 18px; display: flex; flex-direction: column; gap: 4px; }
.term .opt { background: none; border: 0; color: var(--term); font-family: var(--mono); font-size: 15px; text-align: left; padding: 4px 6px; cursor: pointer; }
.term .opt:hover, .term .opt:focus-visible { background: rgba(120,255,180,0.08); outline: none; }
.cursor { display: inline-block; width: 9px; height: 1.1em; background: var(--term); vertical-align: text-bottom; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* кодовый замок */
.keypad { background: #151818; border: 1px solid var(--line); padding: 20px; width: 280px; }
.keypad .disp { font-family: var(--mono); font-size: 30px; letter-spacing: 0.4em; text-align: center; background: #050806; color: #7aff9a; padding: 10px; margin-bottom: 14px; border: 1px solid #1d3a2a; }
.keypad .disp.err { color: #ff5a3a; }
.keypad .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad .grid button { font-family: var(--mono); font-size: 20px; padding: 12px 0; background: #222626; color: var(--text); border: 1px solid #333; cursor: pointer; }
.keypad .grid button:hover { background: #2c3232; }
.keypad .lbl { font-size: 11px; letter-spacing: 0.2em; color: var(--dim); margin-bottom: 10px; text-align: center; }

/* финал */
#ending { overflow-y: auto; align-items: flex-start; }
#ending .wrap { max-width: 680px; padding: 48px 30px; margin: auto; }
#ending h2 { font-weight: 300; letter-spacing: 0.4em; font-size: 30px; margin: 0 0 30px; }
#ending p { font-size: 17px; line-height: 1.75; color: #d8dcd4; opacity: 0; animation: rise 1.6s forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#ending .stats { margin-top: 30px; color: var(--dim); font-size: 13px; line-height: 1.8; font-family: var(--mono); opacity: 0; animation: rise 1.5s forwards; }

/* осмотр предмета */
#examine-ui { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%); max-width: 640px; text-align: center; pointer-events: none; }
#examine-ui .t { font-size: 20px; margin-bottom: 8px; }
#examine-ui .d { font-size: 15px; line-height: 1.55; color: #cfd4cc; }
#examine-ui .h { font-size: 12px; color: var(--dim); margin-top: 14px; }
#active-item { position: fixed; right: 20px; top: 18px; font-size: 13px; color: var(--dim); }
</style>
</head>
